<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem("platforge.theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PlatForge Studio</title>
<style>:root{
 --bg0:#0d0f13;--bg1:#13161c;--bg2:#191d25;--bg3:#21262f;--bg4:#2a303b; --line:#232832;--line2:#2f3542;--line3:#3a4150;--text:#e8eaf0;--text2:#d3d7df;--text3:#c3c8d2;--muted:#9aa2b2;--dim:#626a7b; --purple:#c8adff;--green-t:#7ef0b8;--blue-t:#8cc2ff;--code:#ffd2b0;--warn-t:#ffc58f;--danger-t:#ff8f98;--pink-t:#ffb3ec; --pop:#1d2129;--float:rgba(19,22,28,.94);--dbgbg:rgba(13,15,19,.92);--chk1:#20252e;--chk2:#1a1e26;--canvas:#0b0d11;--stage:#0c0e12;--track:#2c323e;--scroll:#2b313c;--ink:255,255,255;--screen:rgba(255,216,77,.6); --play-bg:#1f2a24;--play-line:#2c4537;--play-bg2:#243329;--play-line2:#36594a;--shadow:rgba(0,0,0,.35);color-scheme:dark;
 --accent:#ff8a3d;--accent-h:#ff9e5e;--accent-soft:rgba(255,138,61,.13);--accent-line:rgba(255,138,61,.45);
 --danger:#f0616d;--ok:#3ddc97;--info:#5aa9ff;--cond:#5aa9ff;--act:#3ddc97;--sys:#b48cff;
 --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",system-ui,sans-serif;
 --mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;
}
:root[data-theme="light"]{--bg0:#eef0f4;--bg1:#ffffff;--bg2:#f5f6f8;--bg3:#eaecf0;--bg4:#dfe3e9;
 --line:#e2e5eb;--line2:#d2d7df;--line3:#b9c0cb;--text:#161a21;--text2:#262b34;--text3:#454c59;--muted:#5d6472;--dim:#8a909d;
 --accent-soft:rgba(255,138,61,.14);--accent-line:rgba(230,110,30,.55);
 --purple:#6d43c9;--green-t:#0f7a50;--blue-t:#1f5fc4;--code:#a8480a;--warn-t:#8f5600;--danger-t:#c22f3b;--pink-t:#a81a76;
 --pop:#ffffff;--float:rgba(255,255,255,.96);--dbgbg:rgba(13,15,19,.92);--chk1:#e4e7ec;--chk2:#f3f4f7;--canvas:#e6e9ee;--stage:#e3e6eb;--track:#d4d9e1;--scroll:#c5cbd5;--ink:0,0,0;--screen:#b98a00;
 --play-bg:#e3f6ec;--play-line:#a8dcc1;--play-bg2:#d4f0e1;--play-line2:#86cba8;--shadow:rgba(30,40,60,.12);color-scheme:light;}
.playov,.playov *{}

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg0);color:var(--text);font:13px/1.4 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.fill{fill:currentColor;stroke:none}
kbd{font:600 10.5px var(--mono);padding:1px 5px;border-radius:4px;background:rgba(var(--ink),.07);border:1px solid rgba(var(--ink),.1);color:var(--muted);line-height:1.4}
.mono{font-family:var(--mono)}
img.px,canvas.px{image-rendering:pixelated}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:10px;border:3px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background-color:var(--line3)}::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}

#app{display:grid;height:100vh;grid-template-columns:256px 1fr 304px;grid-template-rows:50px 1fr 28px;grid-template-areas:"top top top" "left center right" "status status status"}
.top{grid-area:top;display:flex;align-items:center;gap:6px;padding:0 10px 0 12px;background:var(--bg1);border-bottom:1px solid var(--line);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:9px;padding-right:12px;margin-right:4px;border-right:1px solid var(--line);height:30px}
.brand-n{font-weight:750;letter-spacing:-.01em;font-size:14.5px;white-space:nowrap}
.brand-n span{color:var(--muted);font-weight:500;margin-left:3px}
.proj{background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 8px;width:190px;font-weight:600;outline:none}
.proj:hover{background:var(--bg2)}.proj:focus{background:var(--bg0);border-color:var(--accent-line)}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px;flex:none}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px;border-radius:7px;border:1px solid var(--line2);background:var(--bg2);color:var(--text);font-weight:550;white-space:nowrap;transition:background .12s,border-color .12s,transform .06s}
.btn:hover{background:var(--bg3);border-color:var(--line3)}
.btn:active{transform:translateY(1px)}
.btn.sm{height:26px;padding:0 8px;font-size:12px;border-radius:6px;gap:5px}
.btn.sm svg.i{width:14px;height:14px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text3)}
.btn.ghost:hover{background:var(--bg2);color:var(--text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a0f07}
.btn.primary:hover{background:var(--accent-h);border-color:var(--accent-h)}
.btn.play{background:var(--play-bg);border-color:var(--play-line);color:var(--green-t)}
.btn.play:hover{background:var(--play-bg2);border-color:var(--play-line2)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger-ghost{background:transparent;color:var(--danger-t);border-color:rgba(240,97,109,.35)}
.btn.danger-ghost:hover{background:rgba(240,97,109,.1)}
.btn:disabled{opacity:.38;pointer-events:none}
.btn.primary kbd{background:rgba(0,0,0,.12);border-color:rgba(0,0,0,.15);color:rgba(26,15,7,.7)}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--text3);transition:background .12s,color .12s;flex:none}
.icon-btn:hover{background:var(--bg3);color:var(--text)}
.icon-btn:disabled{opacity:.3;pointer-events:none}
.icon-btn.on{color:var(--accent);background:var(--accent-soft)}
.icon-btn.sm{width:24px;height:24px;border-radius:6px}
.icon-btn.sm svg.i{width:14px;height:14px}
.split{display:inline-flex}
.split .btn:first-child{border-top-right-radius:0;border-bottom-right-radius:0}
.split .btn:last-child{border-top-left-radius:0;border-bottom-left-radius:0;border-left-color:var(--play-line);padding:0 8px}

.panel{background:var(--bg1);overflow:hidden;display:flex;flex-direction:column;min-height:0}
.left{grid-area:left;border-right:1px solid var(--line)}
.right{grid-area:right;border-left:1px solid var(--line)}
.ptitle{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 6px 14px;flex:none}
.ptitle h4,.sec-t{margin:0;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tree{flex:1;overflow:auto;padding:0 8px 16px}
.tgroup{margin-bottom:6px}
.thead{display:flex;align-items:center;gap:6px;padding:6px 4px 6px 6px;border-radius:6px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;user-select:none}
.thead:hover{color:var(--text)}
.thead .chev{transition:transform .15s;width:12px;height:12px}
.tgroup.closed .chev{transform:rotate(-90deg)}
.tgroup.closed .titems{display:none}
.thead .grow{flex:1}
.thead .count{font:600 10px var(--mono);color:var(--dim);letter-spacing:0}
.titem{display:flex;align-items:center;gap:9px;padding:5px 6px 5px 8px;border-radius:7px;cursor:pointer;border:1px solid transparent;position:relative;user-select:none;min-height:32px}
.titem:hover{background:var(--bg2)}
.titem.on{background:var(--accent-soft);border-color:rgba(255,138,61,.28)}
.titem.open .nm{color:var(--text)}
.titem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:550;color:var(--text2)}
.titem .meta{font:11px var(--mono);color:var(--dim)}
.titem .acts{display:none;gap:1px}
.titem:hover .acts{display:flex}.titem:hover .meta{display:none}
.titem input{flex:1;min-width:0;background:var(--bg0);border:1px solid var(--accent-line);border-radius:5px;padding:2px 6px;outline:none}
.ticon{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--bg3);color:var(--muted);flex:none;overflow:hidden}
.ticon img{max-width:20px;max-height:20px;image-rendering:pixelated}
.ticon.lay{background:rgba(90,169,255,.12);color:var(--blue-t)}
.ticon.sht{background:rgba(180,140,255,.12);color:var(--purple)}
.ticon.txt{font:800 12px var(--font);color:var(--text2)}
.tbadge{font:600 9.5px var(--font);letter-spacing:.04em;text-transform:uppercase;color:var(--dim);padding:1px 5px;border:1px solid var(--line2);border-radius:4px}
.titem.drag-ghost{opacity:.5}

.center{grid-area:center;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg0)}
.tabbar{display:flex;align-items:flex-end;gap:2px;padding:6px 8px 0;background:var(--bg1);border-bottom:1px solid var(--line);height:40px;flex:none;overflow-x:auto;overflow-y:hidden}
.tab2{display:flex;align-items:center;gap:7px;height:33px;padding:0 6px 0 11px;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:550;user-select:none;position:relative;top:1px}
.tab2:hover{color:var(--text);background:var(--bg2)}
.tab2.on{background:var(--bg0);color:var(--text);border-color:var(--line)}
.tab2 .x{opacity:0;width:20px;height:20px}
.tab2:hover .x,.tab2.on .x{opacity:1}
.tab2 .ti{width:14px;height:14px}
.tab2.lay .ti{color:var(--blue-t)}.tab2.sht .ti{color:var(--purple)}
.views{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}
.empty-center{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);text-align:center}

/* layout view */
#lv{overflow:hidden}
#lvCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.float{position:absolute;background:var(--float);backdrop-filter:blur(8px);border:1px solid var(--line2);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.tools{top:12px;left:12px;display:flex;flex-direction:column;padding:4px;gap:2px}
.tool{width:36px;height:36px;display:grid;place-items:center;border-radius:7px;border:0;background:transparent;color:var(--text3)}
.tool:hover{background:var(--bg3);color:var(--text)}
.tool.on{background:var(--accent);color:#1a0f07}
.tool svg.i{width:18px;height:18px}
.tools hr{border:0;height:1px;background:var(--line2);margin:3px 4px}
.zoom{left:12px;bottom:12px;display:flex;align-items:center;padding:3px;gap:1px}
.zoom .val{min-width:52px;text-align:center;font:600 12px var(--mono);color:var(--text3);background:transparent;border:0;height:30px;border-radius:6px}
.zoom .val:hover{background:var(--bg3)}
.zoom .icon-btn{width:30px;height:30px}
.zoom .gsel{height:26px;background:var(--bg0);border:1px solid var(--line2);border-radius:6px;font:600 11.5px var(--mono);padding:0 4px;margin:0 4px;outline:none}
.stamp-chip{top:12px;left:62px;display:none;align-items:center;gap:8px;padding:6px 10px 6px 6px;font-size:12px;color:var(--muted)}
.stamp-chip.on{display:flex}
.stamp-chip img{width:22px;height:22px;object-fit:contain;image-rendering:pixelated;background:var(--bg3);border-radius:5px}
.stamp-chip b{color:var(--text)}
.lv-hint{top:12px;left:62px;max-width:calc(100% - 330px);white-space:normal;padding:7px 12px;display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px;pointer-events:none;transition:opacity .3s;}
.lv-hint b{color:var(--text);font-weight:600}
.lv-hint.hide{opacity:0}

/* props */
.rtabs{display:flex;gap:2px;margin:12px 12px 8px;padding:3px;background:var(--bg0);border-radius:8px;border:1px solid var(--line);flex:none}
.rtab{flex:1;height:28px;border:0;background:transparent;border-radius:6px;color:var(--muted);font-weight:600}
.rtab:hover{color:var(--text)}.rtab.on{background:var(--bg3);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.insp{flex:1;overflow:auto;padding:0 14px 24px}
.sec{padding:14px 0;border-top:1px solid var(--line)}
.sec:first-child{border-top:0;padding-top:4px}
.sec-t{margin-bottom:11px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.field{margin-bottom:12px}
.field:last-child{margin-bottom:0}
.field>label,.flabel{display:block;font-size:12px;color:var(--text3);margin-bottom:6px;font-weight:500}
.inp{width:100%;height:32px;background:var(--bg0);border:1px solid var(--line2);border-radius:7px;padding:0 10px;outline:none;transition:border-color .12s}
.inp:hover{border-color:var(--line3)}.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp.err{border-color:var(--danger);box-shadow:0 0 0 3px rgba(240,97,109,.12)}
select.inp{padding:0 8px;appearance:auto}
textarea.inp{height:auto;min-height:60px;padding:8px 10px;resize:vertical;line-height:1.4}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.unit{position:relative}.unit .inp{padding-right:30px}.unit em{position:absolute;right:9px;top:8px;font-style:normal;font-size:11px;color:var(--dim);pointer-events:none}
.seg{display:flex;flex-wrap:wrap;gap:2px;padding:3px;background:var(--bg0);border:1px solid var(--line2);border-radius:8px}
.seg button{flex:1 1 auto;min-width:0;height:26px;border:0;border-radius:5px;background:transparent;color:var(--muted);font-size:12px;font-weight:600;padding:0 8px;white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--bg4);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.35)}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;margin-bottom:10px;user-select:none}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch .track{width:32px;height:18px;border-radius:10px;background:var(--track);position:relative;flex:none;transition:background .15s}
.switch .knob{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--text3);transition:transform .15s,background .15s}
.switch input:checked+.track{background:var(--accent)}
.switch input:checked+.track .knob{transform:translateX(14px);background:#fff}
.sw-l{font-size:12.5px;color:var(--text2)}
.obj-head{display:flex;gap:12px;align-items:center;padding:4px 0 12px}
.obj-thumb{width:52px;height:52px;border-radius:10px;background:var(--bg2) repeating-conic-gradient(var(--chk1) 0 25%,var(--chk2) 0 50%) 0 0/12px 12px;border:1px solid var(--line2);flex:none;display:grid;place-items:center;overflow:hidden}
.obj-thumb img{max-width:44px;max-height:44px;image-rendering:pixelated}
.obj-thumb.txt{font:800 22px var(--font);background:var(--bg2)}
.obj-name{font-weight:700;font-size:15px}
.obj-sub{color:var(--dim);font-size:11.5px;margin-top:2px}
.note{margin:0;color:var(--muted);font-size:12px;line-height:1.55}
.note.warn{color:var(--warn-t);background:rgba(255,138,61,.08);border:1px solid rgba(255,138,61,.25);border-radius:7px;padding:8px 10px;display:flex;gap:8px}
.note b{color:var(--text)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.row-btns .btn{flex:1;justify-content:center}
.bh{border:1px solid var(--line2);border-radius:9px;background:var(--bg2);margin-bottom:8px;overflow:hidden}
.bh-h{display:flex;align-items:center;gap:8px;padding:8px 6px 8px 10px;cursor:pointer;user-select:none}
.bh-h b{flex:1;font-weight:650;font-size:12.5px}
.bh-ic{width:22px;height:22px;border-radius:6px;background:rgba(61,220,151,.12);color:var(--green-t);display:grid;place-items:center;flex:none}
.bh-ic svg.i{width:13px;height:13px}
.bh-b{padding:4px 10px 10px;border-top:1px solid var(--line)}
.bh.closed .bh-b{display:none}
.bh-b .field{margin:10px 0 0}
.bh-b .switch{margin:10px 0 0}
.bh-d{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.5}
.vars{display:flex;flex-direction:column;gap:6px}
.var-row{display:grid;grid-template-columns:1fr 70px 1fr 24px;gap:5px;align-items:center}
.var-row .inp{height:28px;font-size:12px;padding:0 7px}
.color-row{display:flex;gap:8px;align-items:center}
.color-row input[type=color]{width:38px;height:32px;border:1px solid var(--line2);border-radius:7px;background:var(--bg0);padding:2px;cursor:pointer}
.color-row .inp{flex:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12px}
.kv span:nth-child(odd){color:var(--muted)}
.ref{font-size:12px;color:var(--muted);line-height:1.6}
.ref code{font:600 11.5px var(--mono);color:var(--code);background:rgba(255,138,61,.08);padding:1px 5px;border-radius:4px;white-space:nowrap}
.ref p{margin:0 0 10px}
.ref .rgrid{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;margin-bottom:12px;align-items:baseline}.ref .rgrid code{justify-self:start}

/* status */
.status{grid-area:status;display:flex;align-items:center;gap:16px;padding:0 12px;background:var(--bg1);border-top:1px solid var(--line);color:var(--dim);font-size:11.5px;white-space:nowrap;overflow:hidden}
.status .s{display:flex;align-items:center;gap:6px}
.status .s b{color:var(--text3);font:500 11.5px var(--mono)}
.save-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(61,220,151,.15)}
.save-dot.pending{background:#f4c04e;box-shadow:0 0 0 3px rgba(244,192,78,.15)}
.save-dot.error{background:var(--danger)}

/* event sheet */
#sv{overflow:auto}
.sheet{padding:18px 22px 120px;min-width:760px}
.sh-top{display:flex;align-items:center;gap:8px;margin-bottom:14px;position:sticky;top:0;z-index:3;background:var(--bg0);padding:4px 0 10px;border-bottom:1px solid var(--line)}
.sh-top h2{margin:0 10px 0 0;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.sh-top h2 svg.i{color:var(--purple);width:18px;height:18px}
.globals{margin-bottom:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg1);overflow:hidden}
.gv{display:flex;align-items:center;gap:8px;padding:7px 10px;border-top:1px solid var(--line);font-size:12.5px;cursor:pointer}
.gv:first-child{border-top:0}
.gv:hover{background:var(--bg2)}
.gv .kw{font:700 10.5px var(--font);letter-spacing:.05em;text-transform:uppercase;color:var(--purple);background:rgba(180,140,255,.12);padding:2px 6px;border-radius:4px}
.gv .vn{font-weight:650}
.gv .vv{font-family:var(--mono);color:var(--code)}
.gv .grow{flex:1}
.gv .acts{opacity:0;display:flex}
.gv:hover .acts{opacity:1}
.gv.empty{color:var(--dim);cursor:default}
.evlist{display:flex;flex-direction:column;gap:6px}
.ev{display:grid;grid-template-columns:30px minmax(260px,42%) 1fr;border:1px solid var(--line2);border-radius:10px;background:var(--bg1);overflow:hidden;position:relative}
.ev.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ev.off{opacity:.45}
.ev-n{display:flex;align-items:flex-start;justify-content:center;padding-top:10px;font:600 10.5px var(--mono);color:var(--dim);background:var(--bg2);border-right:1px solid var(--line);cursor:grab;user-select:none}
.ev-n:hover{color:var(--text)}
.ev-c{padding:6px;border-right:1px solid var(--line);background:linear-gradient(90deg,rgba(90,169,255,.05),transparent);display:flex;flex-direction:column;gap:3px;min-width:0}
.ev-a{padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.ace{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent;min-height:30px;user-select:none}
.ace:hover{background:var(--bg3)}
.ace.sel{background:var(--accent-soft);border-color:var(--accent-line)}
.ace.off{opacity:.45;text-decoration:line-through}
.ace .oic{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;background:var(--bg3);flex:none;overflow:hidden}
.ace .oic img{max-width:18px;max-height:18px;image-rendering:pixelated}
.ace .oic svg.i{width:13px;height:13px}
.ace .oic.sys{background:rgba(180,140,255,.14);color:var(--purple)}
.ace .oic.kb{background:rgba(90,169,255,.14);color:var(--blue-t)}
.ace .oic.au{background:rgba(61,220,151,.14);color:var(--green-t)}
.ace .oic.tx{font:800 11px var(--font)}
.ace .on{font-weight:650;color:var(--text2);white-space:nowrap}
.ace .tx2{color:var(--text3);min-width:0;overflow-wrap:anywhere}
.ace .tx2 b{color:var(--code);font-weight:600;font-family:var(--mono);font-size:12px}
.ace .tx2 i{font-style:normal;color:var(--blue-t);font-weight:600}
.ace .not{font:800 9.5px var(--font);letter-spacing:.05em;color:#fff;background:var(--danger);padding:1px 5px;border-radius:4px;flex:none}
.ace .trig{color:var(--warn-t);flex:none}
.ace .trig svg.i{width:12px;height:12px}
.ace.empty{color:var(--dim);font-style:italic;cursor:default}
.ace.empty:hover{background:transparent}
.addl{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;border:0;background:transparent;color:var(--dim);font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:6px;margin-top:1px;opacity:.75}.ev:hover .addl,.ev.sel .addl{opacity:1}
.addl svg.i{width:13px;height:13px}
.addl:hover{color:var(--text);background:var(--bg3)}
.ev-c .addl:hover{color:var(--blue-t)}.ev-a .addl:hover{color:var(--green-t)}
.subs{margin-left:30px;padding-left:14px;border-left:2px solid var(--line2);display:flex;flex-direction:column;gap:6px;margin-top:6px}
.cmt{display:flex;align-items:flex-start;gap:9px;padding:8px 12px;border-radius:10px;background:rgba(244,192,78,.08);border:1px solid rgba(244,192,78,.22);color:var(--warn-t);font-size:12.5px;cursor:pointer}
.cmt.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cmt svg.i{margin-top:2px;width:14px;height:14px;flex:none}
.cmt textarea{flex:1;background:transparent;border:0;outline:none;resize:none;color:inherit;font:inherit;line-height:1.5;padding:0;min-height:20px}
.drop-line{height:3px;border-radius:3px;background:var(--accent);margin:-2px 0}
.sheet-empty{border:1px dashed var(--line2);border-radius:12px;padding:30px;text-align:center;color:var(--muted)}
.sheet-empty b{display:block;color:var(--text);font-size:14px;margin-bottom:6px}

/* wizard */
.wiz-objs{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.wobj{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 10px;border-radius:10px;border:1px solid var(--line2);background:var(--bg2);text-align:center;transition:border-color .12s,background .12s}
.wobj:hover{border-color:var(--accent);background:var(--bg3)}
.wobj .wi{width:44px;height:44px;border-radius:9px;display:grid;place-items:center;background:var(--bg0) repeating-conic-gradient(var(--chk1) 0 25%,var(--chk2) 0 50%) 0 0/10px 10px;overflow:hidden}
.wobj .wi img{max-width:38px;max-height:38px;image-rendering:pixelated}
.wobj .wi svg.i{width:22px;height:22px}
.wobj .wi.sys{background:rgba(180,140,255,.14);color:var(--purple)}.wobj .wi.kb{background:rgba(90,169,255,.14);color:var(--blue-t)}.wobj .wi.au{background:rgba(61,220,151,.14);color:var(--green-t)}
.wobj .wi.tx{font:800 18px var(--font);background:var(--bg0)}
.wobj span{font-size:12px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wobj small{font-size:10.5px;color:var(--dim)}
.wiz-sec{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px}
.wiz-sec:first-child{margin-top:0}
.wiz-search{margin-bottom:12px}
.wace{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:8px;border:1px solid transparent;background:transparent}
.wace:hover,.wace.kf{background:var(--bg3);border-color:var(--line2)}
.wace .wn{flex:1;font-weight:550}
.wace small{color:var(--dim);font-size:11px}
.wace .trig{color:var(--warn-t)}
.wcat{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:12px 10px 4px}
.wcat:first-child{margin-top:0}
.wiz-crumb{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding:8px 10px;border-radius:9px;background:var(--bg2);border:1px solid var(--line)}
.wiz-crumb .oic{width:24px;height:24px}
.wiz-crumb b{font-weight:650}
.wiz-crumb .grow{flex:1}
.xhelp{font-size:11.5px;color:var(--dim);margin-top:5px;min-height:16px}
.xhelp.err{color:var(--danger-t)}
.xchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.xchips button{border:1px solid var(--line2);background:var(--bg2);border-radius:5px;font:600 11px var(--mono);color:var(--text3);padding:2px 6px}
.xchips button:hover{border-color:var(--accent);color:var(--text)}

/* ctx menu */
.ctx{position:fixed;z-index:400;min-width:220px;background:var(--pop);border:1px solid var(--line3);border-radius:10px;padding:5px;box-shadow:0 14px 40px rgba(0,0,0,.5);animation:pop .12s ease}
.ctx button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border:0;background:transparent;border-radius:6px;text-align:left;color:var(--text2);font-size:12.5px}
.ctx button:hover{background:var(--bg4);color:#fff}
.ctx button.danger{color:var(--danger-t)}
.ctx button kbd{margin-left:auto}
.ctx hr{border:0;height:1px;background:var(--line2);margin:4px 6px}

/* sprite editor */
.se-back{position:fixed;inset:0;z-index:90;background:rgba(5,6,9,.7);backdrop-filter:blur(4px);display:grid;place-items:center;padding:18px;animation:fade .14s ease}
.se{width:min(1280px,100%);height:min(860px,100%);background:var(--bg1);border:1px solid var(--line2);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.55);display:grid;grid-template-columns:56px 1fr 248px;grid-template-rows:52px 1fr 168px;grid-template-areas:"h h h" "t c r" "b b b";overflow:hidden;animation:pop .18s cubic-bezier(.2,1.3,.4,1)}
.se-h{grid-area:h;display:flex;align-items:center;gap:10px;padding:0 12px 0 18px;border-bottom:1px solid var(--line)}
.se-h h3{margin:0;font-size:15px;font-weight:700}
.se-h .sub{color:var(--dim);font:12px var(--mono)}
.se-t{grid-area:t;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-right:1px solid var(--line);background:var(--bg1)}
.se-t hr{width:28px;border:0;height:1px;background:var(--line2);margin:5px 0}
.se-c{grid-area:c;position:relative;overflow:hidden;background:var(--canvas)}
.se-c canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.se-r{grid-area:r;border-left:1px solid var(--line);overflow:auto;padding:14px}
.se-b{grid-area:b;border-top:1px solid var(--line);display:grid;grid-template-columns:230px 1fr;min-height:0}
.se-anims{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.se-anims .list{flex:1;overflow:auto;padding:0 8px 8px}
.se-anim{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 10px;border-radius:7px;cursor:pointer;border:1px solid transparent;font-weight:550}
.se-anim:hover{background:var(--bg2)}
.se-anim.on{background:var(--accent-soft);border-color:rgba(255,138,61,.28)}
.se-anim .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.se-anim .meta{font:11px var(--mono);color:var(--dim)}
.se-anim input{flex:1;min-width:0;background:var(--bg0);border:1px solid var(--accent-line);border-radius:5px;padding:2px 6px;outline:none}
.se-frames{display:flex;flex-direction:column;min-width:0;min-height:0}
.se-fbar{display:flex;align-items:center;gap:6px;padding:8px 10px 6px}
.se-fbar .sp{flex:1}
.se-fbar label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.se-fbar input[type=number]{width:58px;height:26px;background:var(--bg0);border:1px solid var(--line2);border-radius:6px;padding:0 6px;outline:none;font:12px var(--mono)}
.se-strip{flex:1;display:flex;gap:8px;overflow-x:auto;padding:4px 10px 10px;align-items:flex-start}
.se-fr{flex:none;width:84px;cursor:pointer;text-align:center}
.se-fr .fc{width:84px;height:84px;border-radius:9px;border:1px solid var(--line2);background:repeating-conic-gradient(var(--chk1) 0 25%,var(--chk2) 0 50%) 0 0/10px 10px;display:grid;place-items:center;overflow:hidden}
.se-fr .fc canvas{max-width:76px;max-height:76px;image-rendering:pixelated}
.se-fr span{font:600 10.5px var(--mono);color:var(--dim)}
.se-fr.on .fc{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.se-fr.add .fc{border-style:dashed;background:transparent;color:var(--dim)}
.se-fr.add:hover .fc{color:var(--text);border-color:var(--line3)}
.pal{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.pal button{aspect-ratio:1;border:0;border-radius:4px;padding:0;box-shadow:inset 0 0 0 1px rgba(var(--ink),.08)}
.pal button.on{box-shadow:0 0 0 2px #fff,0 0 0 3px var(--bg1)}
.pal button.tr{background:repeating-conic-gradient(#555 0 25%,#999 0 50%) 0 0/8px 8px}
.cur-col{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.cur-col .sw{width:44px;height:44px;border-radius:9px;border:1px solid var(--line2);position:relative;overflow:hidden;background:repeating-conic-gradient(#444 0 25%,#777 0 50%) 0 0/10px 10px}
.cur-col .sw i{position:absolute;inset:0}
.cur-col input[type=color]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.cur-col .hx{font:600 12px var(--mono);color:var(--muted)}
.se-r input[type=range]{width:100%;accent-color:var(--accent)}
.se-zoom{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:2px;padding:3px}
.se-zoom .val{min-width:50px;text-align:center;font:600 12px var(--mono);color:var(--text3)}
.se-info{position:absolute;right:12px;bottom:12px;padding:6px 10px;font:12px var(--mono);color:var(--muted)}

/* play overlay */
.playov{position:fixed;inset:0;z-index:150;background:rgba(6,7,10,.88);backdrop-filter:blur(6px);display:flex;flex-direction:column;animation:fade .18s ease}
.playov[hidden]{display:none}
.play-bar{height:56px;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid rgba(var(--ink),.06)}
.play-title{display:flex;align-items:center;gap:10px;font-size:14px}
.live{display:inline-flex;align-items:center;gap:6px;font:700 10.5px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--green-t);background:rgba(61,220,151,.1);border:1px solid rgba(61,220,151,.25);padding:3px 8px;border-radius:20px}
.live i{width:6px;height:6px;border-radius:50%;background:#3ddc97;animation:pulse 1.4s infinite}
.play-hint{flex:1;text-align:center;color:var(--muted);font-size:12px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.play-hint span{display:inline-flex;gap:5px;align-items:center}
.play-stage{flex:1;display:grid;place-items:center;padding:20px;min-height:0}
.play-frame{border-radius:12px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(var(--ink),.08);background:#000}
.play-frame canvas{display:block;width:100%;height:100%}
.play-err{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:#3a1d22;border:1px solid #6b2c35;color:var(--danger-t);padding:8px 14px;border-radius:8px;font-size:12px;max-width:80%}

/* modals */
.modal-back{position:fixed;inset:0;z-index:200;background:rgba(5,6,9,.62);backdrop-filter:blur(3px);display:grid;place-items:center;padding:20px;animation:fade .14s ease}
.modal-back.out{opacity:0;transition:opacity .14s}
.modal{width:min(460px,100%);background:var(--bg1);border:1px solid var(--line2);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.55);animation:pop .18s cubic-bezier(.2,1.3,.4,1);overflow:hidden;display:flex;flex-direction:column;max-height:calc(100vh - 40px)}
.modal.wide{width:min(680px,100%)}
.modal.xwide{width:min(820px,100%)}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 6px 20px}
.modal-h h3{margin:0;font-size:16px;font-weight:700}
.modal-b{padding:8px 20px 18px;color:var(--text3);line-height:1.55;overflow:auto;flex:1}
.modal-b p{margin:0 0 10px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;background:var(--bg0);border-top:1px solid var(--line)}
.modal-f .left{margin-right:auto}
.kinds{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kind{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border-radius:10px;border:1px solid var(--line2);background:var(--bg2);text-align:left}
.kind:hover{border-color:var(--line3)}
.kind.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-soft)}
.kind .ki{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--bg0);color:var(--accent)}
.kind b{font-size:13px}
.kind small{font-size:11.5px;color:var(--muted);line-height:1.4}
.exp-card{display:flex;gap:14px;align-items:center;padding:14px;border-radius:10px;background:linear-gradient(135deg,rgba(255,138,61,.12),rgba(255,138,61,.02));border:1px solid rgba(255,138,61,.25);margin-bottom:16px}
.exp-ic{width:44px;height:44px;border-radius:10px;background:var(--accent);color:#1a0f07;display:grid;place-items:center;flex:none}
.exp-ic svg.i{width:22px;height:22px}
.exp-card b{display:block;color:var(--text);font-size:14px}
.exp-card span{font-size:12px;color:var(--muted)}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:4px 26px}
.keys h5{grid-column:1/-1;margin:12px 0 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.keys h5:first-child{margin-top:0}
.keys div{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px dashed var(--line);font-size:12.5px;gap:10px}
.keys div span:last-child{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}

#toasts{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);z-index:500;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{display:flex;align-items:center;gap:9px;padding:9px 14px 9px 12px;border-radius:9px;background:var(--pop);border:1px solid var(--line3);box-shadow:0 10px 30px rgba(0,0,0,.45);font-weight:550;animation:up .2s ease}
.toast.ok svg{color:var(--ok)}.toast.err svg{color:var(--danger)}.toast.info svg{color:var(--info)}
.toast.out{opacity:0;transform:translateY(6px);transition:.25s}
#tip{position:fixed;z-index:600;pointer-events:none;background:var(--bg4);border:1px solid var(--line3);color:var(--text);padding:5px 8px;border-radius:6px;font-size:12px;font-weight:550;box-shadow:0 6px 18px rgba(0,0,0,.4);display:flex;gap:8px;align-items:center;opacity:0;transition:opacity .12s;max-width:320px}
#tip.on{opacity:1}
.drop-zone{position:fixed;inset:10px;z-index:300;border:2px dashed var(--accent);border-radius:16px;background:rgba(255,138,61,.07);display:none;place-items:center;font-size:18px;font-weight:700;color:var(--accent);pointer-events:none}
.drop-zone.on{display:grid}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(6px)}}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
@keyframes pulse{50%{opacity:.35}}
@media (max-width:1180px){#app{grid-template-columns:224px 1fr 280px}.btn .lbl{display:none}.proj{width:140px}}

.ace .wclk{display:inline-flex;align-items:center;color:var(--dim);margin-right:2px}.ace .wclk svg{width:13px;height:13px;opacity:.85}

.lv-side{position:absolute;top:12px;right:12px;width:236px;max-height:calc(100% - 170px);display:flex;flex-direction:column;gap:8px;pointer-events:none}
.lv-side>.float{position:relative;pointer-events:auto}
.layers{width:236px;padding:4px;display:flex;flex-direction:column;min-height:0;flex:0 1 auto}
.layers:not(.closed)#lvLayers{max-height:45%}.elems{flex:0 1 auto;min-height:0}
.ly-h{display:flex;align-items:center;gap:6px;padding:4px 4px 4px 8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer;user-select:none}
.ly-h:hover{color:var(--text)}.ly-h .grow{flex:1}.ly-h .chev{width:12px;height:12px;transition:transform .15s}
.layers.closed .ly-h .chev{transform:rotate(-90deg)}
.ly-list{overflow:auto;display:flex;flex-direction:column;gap:1px;padding-top:2px}
.ly-row{display:flex;align-items:center;gap:2px;padding:2px 2px 2px 2px;border-radius:7px;border:1px solid transparent;cursor:pointer;user-select:none}
.ly-row:hover{background:var(--bg3)}
.ly-row.on{background:var(--accent-soft);border-color:rgba(255,138,61,.3)}
.ly-row.sel .nm{color:var(--accent)}
.ly-row.hid .nm{opacity:.45}
.ly-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:550;padding-left:4px}
.ly-row input{flex:1;min-width:0;background:var(--bg0);border:1px solid var(--accent-line);border-radius:5px;padding:2px 6px;outline:none}
.ly-row .px{font:600 10px var(--mono);color:var(--blue-t);background:rgba(90,169,255,.12);padding:1px 5px;border-radius:4px}
.ly-row .ct{font:600 10.5px var(--mono);color:var(--dim);min-width:18px;text-align:right}
.ly-row .icon-btn.sm{width:22px;height:22px}
.ly-row .icon-btn.on{color:var(--warn-t);background:transparent}
.ace .loop{color:var(--purple);flex:none}.ace .loop svg.i{width:12px;height:12px}

.ace .oic.ms,.wobj .wi.ms{background:rgba(255,184,77,.14);color:var(--warn-t)}
.ace .oic.stg,.wobj .wi.stg{background:rgba(240,97,109,.14);color:var(--danger-t)}
.ticon.snd{background:rgba(61,220,151,.12);color:var(--green-t)}
.titem.playing .ticon.snd{background:#3ddc97;color:#0d2a1d}

/* visual scripting v3 */
.sh-top{flex-wrap:wrap}
.sh-search{display:flex;align-items:center;gap:6px;height:30px;padding:0 8px;border:1px solid var(--line2);border-radius:7px;background:var(--bg1);min-width:220px}
.sh-search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sh-search svg.i{width:14px;height:14px;color:var(--dim)}
.sh-search input{flex:1;min-width:0;background:transparent;border:0;outline:none;font-size:12.5px}
.sh-count{font:600 11px var(--mono);color:var(--dim)}
.ace.hit{background:rgba(244,192,78,.12);box-shadow:inset 0 0 0 1px rgba(244,192,78,.45)}
.ace.hit.sel{box-shadow:inset 0 0 0 1px var(--accent)}
.ev-n{flex-direction:column;align-items:center;gap:4px}
.ev-n .colb{width:20px;height:20px;color:var(--dim)}
.colb svg.i{width:12px;height:12px;transition:transform .15s}
.colb.closed svg.i{transform:rotate(-90deg)}
.subs.coll{display:block;padding:7px 12px;border-left:2px dashed var(--line2);color:var(--dim);font-size:12px;cursor:pointer;border-radius:0 8px 8px 0}
.subs.coll:hover{color:var(--text);background:var(--bg1)}
.orsep{font:800 9.5px var(--font);letter-spacing:.1em;text-transform:uppercase;color:#ffb84d;padding:0 10px;margin:-2px 0}
.ev.orb .ev-c{background:linear-gradient(90deg,rgba(255,184,77,.07),transparent)}
.orbadge{align-self:flex-start;font:800 9.5px var(--font);letter-spacing:.08em;color:#1a0f07;background:#ffb84d;border-radius:4px;padding:1px 6px;margin:2px 0 0 8px}
.grp{border:1px solid rgba(90,169,255,.28);border-radius:11px;background:rgba(90,169,255,.03);overflow:hidden}
.grp.inactive{border-style:dashed;opacity:.85}

.cs-sum{font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cs-sb{display:none;grid-template-columns:repeat(3,1fr);gap:4px 12px;padding:4px 12px 10px 40px}
.cs-step.open .cs-sb{display:grid}
.cs-sb .field{margin-bottom:4px}.cs-wide{grid-column:1/-1}.cs-bool{display:flex;align-items:flex-end;padding-bottom:8px}
.cs-add{display:flex;align-items:center;gap:12px;margin:10px 0}.cs-add select{max-width:300px}
.cs-empty{padding:24px;text-align:center;color:var(--dim);border:1.5px dashed var(--line2);border-radius:10px}
@media (max-width:760px){.cs-head{grid-template-columns:1fr}.cs-sb{grid-template-columns:1fr 1fr;padding-left:12px}}
.ev.bp>.ev-n{position:relative}
.ev.bp>.ev-n::after{content:'';position:absolute;left:4px;top:8px;width:9px;height:9px;border-radius:50%;background:#e8566a;box-shadow:0 0 0 2px var(--bg1)}
.ev.flashev{box-shadow:0 0 0 3px #e8566a;transition:box-shadow .3s}
.dbg-brk{background:rgba(232,86,106,.12);border:1px solid rgba(232,86,106,.45);border-radius:8px;padding:8px 10px;margin:6px 0 10px;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.dbg-brk .row-btns{margin-top:4px;flex-wrap:wrap}
.dbg-fps{float:right;text-transform:none;letter-spacing:0;font-weight:600;color:var(--dim)}
.dbg-spd{margin-bottom:6px}.dbg-spd button{min-width:0}
.kvr.wt span.mono{font-family:var(--mono,monospace);font-size:11.5px}.kvr.wt b.err{color:var(--danger,#e8566a)}
.kvr.wt .icon-btn{margin-left:4px}
.dbg-win{width:100%;margin:4px 0 6px;font-size:12px;height:30px}
.kvr.evr{cursor:pointer}.kvr.evr:hover{background:var(--bg2)}.kvr.evr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kvr.evr.bp span::before{content:'●';color:#e8566a;margin-right:5px}
.minimap{right:12px;bottom:12px;padding:4px;line-height:0;cursor:pointer;user-select:none}
.minimap canvas{border-radius:6px;image-rendering:pixelated;display:block}
.dbg-spd button.on{color:#161a21}

.el-q{margin:2px 4px 4px;padding:4px 8px;border:1px solid var(--line2);border-radius:6px;background:var(--bg0);font-size:12px;outline:none;color:inherit}
.el-q:focus{border-color:var(--accent-line)}
.el-row{gap:4px}.el-row .el-ic{width:20px;height:20px;flex:none}.el-row .el-ic img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
.el-row.part{background:rgba(255,138,61,.06);border-color:rgba(255,138,61,.18)}
.el-ex .chev{width:11px;height:11px;transform:rotate(-90deg);transition:transform .12s}.el-ex.open .chev{transform:none}
.el-inst{display:flex;gap:8px;align-items:center;padding:3px 8px 3px 32px;font-size:11.5px;border-radius:6px;cursor:pointer;color:var(--text3)}
.el-inst:hover{background:var(--bg3)}.el-inst.on{background:var(--accent-soft);color:var(--text)}.el-inst.lock{opacity:.45}
.el-inst .mono{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-left:auto}.el-inst .ly{font-size:10px;color:var(--blue-t)}

.lvsec{border-bottom:1px solid var(--line);padding:2px 0 6px;margin:0 0 4px}
.lvsec .ly-h{padding:8px 2px 6px;font-size:11px}
.lvsec .ly-list{max-height:280px;overflow:auto}
.lvsec#lvLayers .ly-list{max-height:200px}
.lvsec .el-q{margin:2px 0 6px;width:100%}
.lvsec.closed .ly-h .chev{transform:rotate(-90deg)}
.st-all{font-weight:500;text-transform:none;letter-spacing:0;color:var(--dim);margin-left:4px}
.istyle{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.ist:not(.own) .color-row input.inp,.ist:not(.own)>input{color:var(--dim)}
.ist.own label{color:var(--accent)}
.ist label{display:flex;align-items:center;gap:4px}
.ist-r{border:0;background:none;color:var(--dim);cursor:pointer;font-size:13px;padding:0 2px;line-height:1}.ist-r:hover{color:var(--accent)}
.el-btns{display:flex;gap:0;margin-left:2px;opacity:.35;transition:opacity .12s}
.el-row:hover .el-btns,.el-inst:hover .el-btns,.el-btns:has(.on),.el-btns:has(.mix){opacity:1}
.el-btns .icon-btn.sm{width:20px;height:20px}.el-btns .icon-btn svg{width:12px;height:12px}
.el-btns .icon-btn.on{color:var(--accent);background:var(--accent-soft)}
.el-btns .icon-btn.mix{color:var(--accent)}
.el-row.hid .nm,.el-row.offg .nm{opacity:.5}.el-row.offg .nm,.el-inst.offg span:first-child{text-decoration:line-through}
.el-inst .el-btns{margin-left:4px}
/* ---------- floating tool panels: find / history ---------- */
.fpanel{position:fixed;top:58px;right:300px;width:440px;max-height:min(640px,calc(100vh - 90px));z-index:300;display:flex;flex-direction:column;background:var(--pop);border:1px solid var(--line3);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.45);animation:pop .14s ease;overflow:hidden}
.fpanel.out{opacity:0;transform:translateY(-4px);transition:opacity .14s,transform .14s}
.fp-h{display:flex;align-items:center;gap:8px;padding:9px 8px 9px 14px;border-bottom:1px solid var(--line);cursor:move;user-select:none}
.fp-h h4{margin:0;font-size:13px;font-weight:700}.fp-h>svg.i{width:15px;height:15px;color:var(--accent)}.fp-h kbd{font-size:10px}
.fp-b{display:flex;flex-direction:column;min-height:0;flex:1}
.fd-row{display:flex;align-items:center;gap:6px;padding:8px 10px 0}
.fd-in{flex:1;display:flex;align-items:center;gap:6px;height:32px;padding:0 4px 0 9px;border:1px solid var(--line2);border-radius:7px;background:var(--bg0)}
.fd-in:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fd-in>svg.i{width:14px;height:14px;color:var(--dim);flex:none}
.fd-in input{flex:1;min-width:0;background:transparent;border:0;outline:none;font-size:12.5px;color:var(--text)}
.fd-o{height:24px;min-width:26px;padding:0 5px;border-radius:5px;border:1px solid transparent;background:transparent;color:var(--muted);font:700 11px var(--mono);cursor:pointer}
.fd-o:hover{background:var(--bg3);color:var(--text)}.fd-o.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.fd-tg svg.i{transform:rotate(-90deg);transition:transform .12s}.fd-tg.open svg.i{transform:none}
.fd-bar{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line)}
.fd-scope{width:auto;height:28px;font-size:12px}.fd-cnt{font-size:12px;color:var(--muted)}.fd-cnt b{color:var(--text)}.fd-cnt .err{color:var(--danger-t)}
.fd-res{overflow:auto;padding:4px 6px 8px;min-height:60px}
.fd-sh{display:flex;align-items:center;gap:6px;padding:9px 6px 4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.fd-sh svg.i{width:13px;height:13px}
.fd-r{display:flex;align-items:flex-start;gap:8px;padding:6px 6px;border-radius:7px;cursor:pointer;border:1px solid transparent}
.fd-r:hover{background:var(--bg3)}.fd-r.cur{background:var(--accent-soft);border-color:var(--accent-line)}.fd-r.off .fd-tx{opacity:.55;text-decoration:line-through}
.fd-r>input{margin:3px 2px 0;accent-color:var(--accent);flex:none}
.fd-k{flex:none;width:18px;height:18px;display:grid;place-items:center;color:var(--dim);margin-top:1px}.fd-k svg.i{width:13px;height:13px}
.fd-t{flex:1;min-width:0}.fd-tx{font-size:12.5px;line-height:1.45;color:var(--text2);word-break:break-word}
.fd-loc{font-size:11px;color:var(--dim);margin-top:1px}
.fd-r mark,.fd-pv mark{background:rgba(244,192,78,.35);color:inherit;border-radius:2px;padding:0 1px}
.fd-pv{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:4px;font-size:11.5px}
.fd-pv small{width:100%;color:var(--dim);font-size:10.5px}
.fd-pv code{font:11.5px var(--mono);padding:1px 5px;border-radius:4px;background:var(--bg0);border:1px solid var(--line2);word-break:break-all}
.fd-pv code.was{text-decoration:line-through;text-decoration-color:rgba(232,86,106,.6);color:var(--muted)}.fd-pv code.now{color:var(--green-t);border-color:rgba(126,240,184,.3)}
.fd-pv>span{color:var(--dim)}
.fd-one{opacity:0;flex:none}.fd-r:hover .fd-one{opacity:1}
.fd-all{display:flex;align-items:center;gap:6px;padding:6px 8px 2px;font-size:12px;color:var(--muted)}.fd-all input{accent-color:var(--accent)}
.fd-sym{margin:6px 2px 4px;padding:6px;border:1px dashed var(--accent-line);border-radius:9px;background:var(--accent-soft)}
.fd-symr{display:flex;align-items:center;gap:9px;padding:3px 4px}.fd-symr>svg.i{color:var(--accent);flex:none}
.fd-symr span{display:flex;flex-direction:column;line-height:1.25}.fd-symr small{color:var(--muted);font-size:11px}
.fd-empty{padding:18px 16px;text-align:center;color:var(--muted);font-size:12.5px}.fd-empty>svg.i{width:26px;height:26px;opacity:.5}.fd-empty p{margin:8px 0 0}
.ace.flashfind,.flashfind{animation:flashfind 1.2s ease}
@keyframes flashfind{0%,40%{box-shadow:0 0 0 2px var(--accent),0 0 0 6px var(--accent-soft)}100%{box-shadow:0 0 0 0 transparent}}
.hs-intro{margin:0;padding:9px 14px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.hs-list{overflow:auto;padding:6px;min-height:80px}
.hs-r{display:flex;align-items:center;gap:9px;width:100%;padding:6px 8px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--text2);text-align:left;cursor:pointer;position:relative}
.hs-r:hover{background:var(--bg3)}
.hs-r.cur{background:var(--accent-soft);border-color:var(--accent-line);color:var(--text)}
.hs-r.fut{color:var(--dim)}.hs-r.fut .hs-t{font-style:italic}.hs-r.fut .hs-ic{opacity:.5}
.hs-ic{flex:none;width:22px;height:22px;display:grid;place-items:center;border-radius:6px;background:var(--bg3);color:var(--muted)}.hs-ic svg.i{width:13px;height:13px}
.hs-r.cur .hs-ic{background:var(--accent);color:#1a0f07}
.hs-t{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hs-t em{font-style:normal;font-size:10.5px;color:var(--muted);background:var(--bg3);border-radius:8px;padding:0 5px;margin-left:3px}
.hs-tm{flex:none;font-size:11px;color:var(--dim)}.hs-r.cur .hs-tm b{color:var(--accent)}
.hs-r+.hs-r::before{content:'';position:absolute;left:18px;top:-5px;height:6px;width:2px;background:var(--line2)}
.hs-foot{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.fd-warn{display:flex;gap:7px;align-items:flex-start;margin:4px 4px 2px;font-size:11.5px;color:var(--muted)}.fd-warn svg.i{width:13px;height:13px;flex:none;margin-top:2px;color:var(--accent)}
/* ---------- éditeur de circuit (Route 3D) ---------- */
.modal.tk-modal{width:min(1120px,96vw)}
.tk{display:grid;grid-template-columns:minmax(0,1fr) 480px;gap:18px;min-height:0}
.tk-left{display:flex;flex-direction:column;gap:8px;min-width:0}
.tk-bar{display:flex;gap:8px}.tk-pre{flex:1}
.tk-list{display:flex;flex-direction:column;gap:6px;max-height:min(520px,60vh);overflow:auto;padding-right:4px}
.tk-row{border:1px solid var(--line2);border-radius:9px;background:var(--bg2);padding:7px 8px;cursor:pointer}
.tk-row:hover{border-color:var(--line3)}
.tk-row.on{border-color:var(--accent);background:var(--accent-soft);cursor:default}
.tk-rh{display:flex;align-items:center;gap:8px}.tk-rh b{font-size:13px;font-weight:650}
.tk-rh .icon-btn{width:26px;height:26px;opacity:.55}.tk-row:hover .tk-rh .icon-btn,.tk-row.on .tk-rh .icon-btn{opacity:1}
.tk-num{flex:none;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--bg4);font:700 11px var(--mono);color:var(--muted)}
.tk-row.on .tk-num{background:var(--accent);color:#1a0f07}
.tk-g{display:flex;align-items:center;gap:10px;margin-top:7px}.tk-gl{width:64px;flex:none;font-size:11.5px;color:var(--muted);font-weight:600}
.tk-seg{flex:1;flex-wrap:nowrap}.tk-seg button{padding:0 4px;font-size:11.5px}.tk-seg button.approx{outline:1px dashed var(--accent-line)}
.tk-add{align-self:flex-start}
.tk-txt{min-height:140px}
.tk-right{display:flex;flex-direction:column;gap:6px}
.tk-pv{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line2)}
.tk-pv canvas{display:block;width:100%;image-rendering:pixelated}
.tk-pvbar{position:absolute;left:8px;right:8px;bottom:8px;display:flex;align-items:center;gap:10px}
.tk-pvl{font-size:11.5px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.tk-cap{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}.tk-cap small{text-transform:none;letter-spacing:0;font-weight:500;color:var(--dim)}
#tkMap,#tkProf{width:100%;background:var(--bg0);border:1px solid var(--line2);border-radius:9px}
.tk-sum{font-size:12px;color:var(--muted)}.tk-sum b{color:var(--text)}
.tk-card{display:flex;flex-direction:column;align-items:stretch;gap:10px;padding:10px 12px;margin-bottom:10px;border:1px solid var(--line2);border-radius:10px;background:var(--bg2)}
.tk-card small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.tk-adv{margin:-2px 0 12px}.tk-adv summary{cursor:pointer;font-size:12px;color:var(--muted);margin-bottom:6px}
@media (max-width:900px){.tk{grid-template-columns:1fr}}
.mm-dot{display:grid;grid-template-columns:minmax(0,1fr) 34px 54px auto;gap:6px;align-items:center;margin-bottom:6px}
.mm-dot input[type=color]{width:34px;height:30px;padding:0;border:1px solid var(--line2);border-radius:6px;background:none}
.mm-dot .inp{height:30px}.mm-bl{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);white-space:nowrap}
</style>
</head>
<body>
<div id="app">
 <header class="top">
  <div class="brand">
   <svg width="26" height="26" viewBox="0 0 26 26"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb26b"/><stop offset="1" stop-color="#ff6a2b"/></linearGradient></defs><rect width="26" height="26" rx="7" fill="url(#lg)"/><rect x="4" y="18" width="18" height="4" rx="1.2" fill="#1a0f07"/><path d="M6.5 15.5 Q11 3 18 9" stroke="#1a0f07" stroke-width="1.6" fill="none" stroke-dasharray="1.6 2.2" stroke-linecap="round"/><rect x="15.5" y="8" width="6" height="6" rx="1.8" fill="#fff"/></svg>
   <div class="brand-n">PlatForge<span>Studio</span></div>
  </div>
  <input class="proj" id="projName" spellcheck="false" data-tip="Nom du projet">
  <div class="sep"></div>
  <button class="btn ghost" id="bNew" data-tip="Nouveau projet"><svg class="i"><use href="#i-file"/></svg><span class="lbl">Nouveau</span></button>
  <button class="btn ghost" id="bOpen" data-tip="Ouvrir un projet ou un jeu exporté" data-kbd="Ctrl+O"><svg class="i"><use href="#i-open"/></svg><span class="lbl">Ouvrir</span></button>
  <button class="btn ghost" id="bSave" data-tip="Télécharger le projet (.json)" data-kbd="Ctrl+S"><svg class="i"><use href="#i-save"/></svg><span class="lbl">Enregistrer</span></button>
  <div class="sep"></div>
  <button class="icon-btn" id="bUndo" data-tip="Annuler" data-kbd="Ctrl+Z"><svg class="i"><use href="#i-undo"/></svg></button>
  <button class="icon-btn" id="bRedo" data-tip="Rétablir" data-kbd="Ctrl+Y"><svg class="i"><use href="#i-redo"/></svg></button>
  <button class="icon-btn" id="bHist" data-tip="Historique des modifications" data-kbd="Ctrl+Maj+H"><svg class="i"><use href="#i-clock"/></svg></button>
  <div class="sep"></div>
  <button class="icon-btn" id="bFind" data-tip="Rechercher / remplacer dans les événements" data-kbd="Ctrl+Maj+F"><svg class="i"><use href="#i-search"/></svg></button>
  <div class="grow"></div>
  <button class="icon-btn theme-ic" id="bTheme" data-tip="Thème clair / sombre" data-kbd="Ctrl+Maj+L"><svg class="i moon"><use href="#i-moon"/></svg><svg class="i sun"><use href="#i-sun"/></svg></button>
  <button class="icon-btn" id="bSettings" data-tip="Paramètres du jeu"><svg class="i"><use href="#i-gear"/></svg></button>
  <button class="icon-btn" id="bHelp" data-tip="Raccourcis clavier" data-kbd="?"><svg class="i"><use href="#i-help"/></svg></button>
  <div class="split">
   <button class="btn play" id="bPlay" data-tip="Tester le niveau ouvert" data-kbd="F5"><svg class="i fill"><use href="#i-play"/></svg><span class="lbl">Tester</span></button>
   <button class="btn play" id="bPlayAll" data-tip="Jouer depuis le premier niveau" data-kbd="Maj+F5"><svg class="i"><use href="#i-restart"/></svg></button>
  </div>
  <button class="btn primary" id="bExport" data-tip="Exporter le jeu en HTML autonome" data-kbd="Ctrl+E"><svg class="i"><use href="#i-export"/></svg><span class="lbl">Exporter</span></button>
 </header>

 <aside class="panel left">
  <div class="ptitle"><h4>Projet</h4></div>
  <div class="tree" id="tree"></div>
 </aside>

 <main class="center">
  <div class="tabbar" id="tabbar"></div>
  <div class="views">
   <div class="view" id="lv">
    <canvas id="lvCanvas" tabindex="0"></canvas>
    <div class="float tools" id="lvTools"></div>
    <div class="float stamp-chip" id="stampChip"></div>
    <div class="float zoom">
     <button class="icon-btn" id="zOut" data-tip="Dézoomer" data-kbd="-"><svg class="i"><use href="#i-minus"/></svg></button>
     <button class="val" id="zVal" data-tip="Zoom 100 %" data-kbd="0">100%</button>
     <button class="icon-btn" id="zIn" data-tip="Zoomer" data-kbd="+"><svg class="i"><use href="#i-plus"/></svg></button>
     <button class="icon-btn" id="zFit" data-tip="Cadrer le niveau" data-kbd="F"><svg class="i"><use href="#i-fit"/></svg></button>
     <div class="sep"></div>
     <button class="icon-btn on" id="zGrid" data-tip="Afficher la grille" data-kbd="Maj+G"><svg class="i"><use href="#i-grid"/></svg></button>
     <button class="icon-btn on" id="zSnap" data-tip="Aimanter à la grille"><svg class="i"><use href="#i-magnet"/></svg></button>
     <button class="icon-btn" id="zMini" data-tip="Mini-carte" data-kbd="M"><svg class="i"><use href="#i-map"/></svg></button>
     <select class="gsel" id="zGs" data-tip="Taille de la grille"><option>8</option><option>16</option><option selected>32</option><option>64</option></select>
    </div>
    <div class="float lv-hint" id="lvHint"></div>
    <div class="float minimap" id="lvMini" hidden><canvas id="mmCv"></canvas></div>
   </div>
   <div class="view" id="sv"></div>
   <div class="empty-center" id="noView" style="display:none"><div>Ouvrez un niveau ou une feuille d’événements<br>depuis le panneau Projet.</div></div>
  </div>
 </main>

 <aside class="panel right">
  <div class="insp" id="insp" style="padding-top:12px"></div>
 </aside>

 <footer class="status">
  <div class="s" id="stA"></div>
  <div class="s" id="stB"></div>
  <div class="s" id="stC"></div>
  <div class="grow"></div>
  <div class="s"><span class="save-dot" id="saveDot"></span><span id="saveTxt">Enregistré localement</span></div>
  <div class="s">PlatForge Studio 2.0</div>
 </footer>
</div>

<div class="playov" id="play" hidden>
 <div class="play-bar">
  <div class="play-title"><span class="live"><i></i>Test</span><b id="playName">Niveau</b></div>
  <div class="play-hint"><span><kbd>←</kbd><kbd>→</kbd> ou <kbd>Q</kbd><kbd>D</kbd> déplacer</span><span><kbd>↑</kbd>/<kbd>Z</kbd>/<kbd>Espace</kbd> sauter</span></div>
  <button class="btn" id="playPause" data-tip="Pause / reprise" data-kbd="F6"><svg class="i fill"><use href="#i-pause"/></svg><span>Pause</span></button>
  <button class="icon-btn" id="playStep" data-tip="Image suivante (en pause)" data-kbd="F7"><svg class="i"><use href="#i-right"/></svg></button>
  <button class="btn" id="playDbg" data-tip="Afficher le débogueur" data-kbd="F8"><svg class="i"><use href="#i-bug"/></svg>Débogueur</button>
  <button class="btn" id="playRestart"><svg class="i"><use href="#i-restart"/></svg>Recommencer<kbd>R</kbd></button>

 case 'say':return (s.who?s.who+' : ':'')+'« '+String(s.text||'').slice(0,40)+(String(s.text||'').length>40?'…':'')+' »';case 'wait':return s.d+' s';
 case 'camto':return '('+s.x+', '+s.y+') en '+s.d+' s';case 'camobj':return on(s.o)+' en '+s.d+' s';case 'camback':return s.d+' s';

function openHelp(){var k=function(a,b){return '<div><span>'+a+'</span><span>'+b.split('|').map(function(x){return '<kbd>'+x+'</kbd>';}).join('')+'</span></div>';};
 modal({title:'Raccourcis clavier',size:'wide',body:'<div class="keys"><h5>Général</h5>'+k('Tester le niveau','F5')+k('Jouer depuis le début','Maj+F5')+k('Annuler / Rétablir','Ctrl+Z|Ctrl+Y')+k('Historique des modifications','Ctrl+Maj+H')+k('Rechercher dans tout le projet','Ctrl+Maj+F')+k('Rechercher et remplacer','Ctrl+H')+k('Enregistrer','Ctrl+S')+k('Ouvrir','Ctrl+O')+k('Exporter','Ctrl+E')+
 '<h5>Éditeur de niveau</h5>'+k('Sélection / Tampon / Vue','V|S|H')+k('Supprimer','Suppr')+k('Dupliquer','Ctrl+D')+k('Dupliquer en glissant','Alt+glisser')+k('Tout sélectionner','Ctrl+A')+k('Déplacer','←|↑|→|↓')+k('Zoom','Molette')+k('Panoramique','Espace+glisser')+k('Cadrer','F')+k('Grille','Maj+G')+
 '<h5>Feuille d’événements</h5>'+k('Nouvel événement','E')+k('Sous-événement','S')+k('Groupe / Fonction','G|F')+k('Variable locale','L')+k('Condition / Action','C|A')+k('Commentaire','Q')+k('Bloc OU','O')+k('Inverser la condition','I')+k('Indenter / désindenter','Tab|Maj+Tab')+k('Replier / déplier','Espace')+k('Copier / couper / coller','Ctrl+C|Ctrl+X|Ctrl+V')+k('Rechercher','Ctrl+F')+k('Déplacer','Alt+↑|Alt+↓')+k('Dupliquer','Ctrl+D')+k('Modifier','Entrée')+
 '<h5>Éditeur d’images</h5>'+k('Crayon / Gomme','B|E')+k('Ligne / Rectangle / Ellipse','L|R|C')+k('Remplissage / Pipette','G|I')+k('Origine','O')+k('Taille du pinceau','[|]')+k('Image précédente / suivante',',|.')+k('Forme carrée / pleine','Maj')+k('Appliquer','Ctrl+Entrée')+'</div>',actions:[{label:'Fermer',kind:'primary',value:true}]});}
$('#bHelp').onclick=openHelp;$('#bUndo').onclick=doUndo;$('#bRedo').onclick=doRedo;$('#bHist').onclick=function(){if(HST.open)fpClose('histPop');else openHistory();};$('#bFind').onclick=function(){if(FND.open)fpClose('findPop');else openFind(null);};

/* ---------- keyboard ---------- */
window.addEventListener('keydown',function(e){
 var mod=e.ctrlKey||e.metaKey,code=e.code;
 if(!$('#play').hidden){if(e.target&&e.target.closest&&e.target.closest('#dbg'))return;if(code==='F6'){e.preventDefault();togglePause();return;}if(code==='F7'){e.preventDefault();stepPlay();return;}if(code==='F8'){e.preventDefault();toggleDbg();return;}if(code==='Escape'){e.preventDefault();if(playing&&playing.cineActive&&playing.cineActive())return;stopPlay();}else if(code==='KeyR'&&!mod&&playing)playing.restart();else if(code==='F5')e.preventDefault();return;}
 if(SE||$('#modals').children.length||$('.ctx'))return;
 if(mod&&((e.shiftKey&&code==='KeyF')||(!e.shiftKey&&code==='KeyH'))){e.preventDefault();if(code==='KeyH')FND.showRep=true;openFind(null);return;}
 if(mod&&e.shiftKey&&code==='KeyH'){e.preventDefault();if(HST.open)fpClose('histPop');else openHistory();return;}
 if(mod&&e.shiftKey&&code==='KeyL'){e.preventDefault();toggleTheme();return;}
 if(code==='F5'||(mod&&code==='Enter')){e.preventDefault();startPlay(e.shiftKey);return;}
 if(mod&&code==='KeyS'){e.preventDefault();saveProject();return;}
 if(mod&&code==='KeyO'){e.preventDefault();$('#fileIn').click();return;}
 if(mod&&code==='KeyE'){e.preventDefault();openExport();return;}
 var tag=e.target.tagName;if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||e.target.isContentEditable)return;
 if(mod&&code==='KeyZ'){e.preventDefault();e.shiftKey?doRedo():doUndo();return;}
 if(mod&&code==='KeyY'){e.preventDefault();doRedo();return;}
 if(e.key==='?'){openHelp();return;}
 var a=ui.active;
 if(a&&a.kind==='sheet'){sheetKey(e);return;}
 if(!a||a.kind!=='layout')return;
 if(mod&&code==='KeyD'){e.preventDefault();dupSel();return;}
 if(mod&&code==='KeyA'){e.preventDefault();selectInsts(curLayout().instances.filter(function(i){return editable(i);}).map(function(i){return i.id;}));return;}
 if(mod)return;
 if(code==='Space'){e.preventDefault();if(!spaceDown){spaceDown=true;lvCursor();}return;}
 if(code==='Delete'||code==='Backspace'){e.preventDefault();deleteSel();return;}
 if(tmKey(e))return;
 if(code==='Escape'&&ui.pathEdit){pathToggle(false);return;}
 if(code==='Escape'){if(ui.sel.kind){ui.sel={kind:null,ids:[]};renderProps();renderTree();lvNeed=true;}if(ui.layoutTool!=='select')setLvTool('select');return;}
 var sel=selInsts();
 if(/^Arrow/.test(code)){e.preventDefault();var st=e.shiftKey?grid.size:1,dx=code==='ArrowLeft'?-st:code==='ArrowRight'?st:0,dy=code==='ArrowUp'?-st:code==='ArrowDown'?st:0;
  if(sel.length){if(!e.repeat)beginOp();willChange();sel.forEach(function(i){i.x+=dx;i.y+=dy;});changed({layout:1});updPosFields();lvNeed=true;}else{var s=vs();s.x+=dx*8/s.z*(e.shiftKey?1:4);s.y+=dy*8/s.z*(e.shiftKey?1:4);lvNeed=true;}return;}
 if(e.shiftKey&&code==='KeyG'){toggleGrid();return;}
 if(code==='KeyM'&&!e.shiftKey&&!e.ctrlKey&&!e.metaKey){mmToggle();return;}
 var map={KeyV:'select',KeyS:'stamp',KeyH:'hand'};if(map[code]){if(code==='KeyV'&&ui.tmTool)tmSetTool(null);setLvTool(map[code]);return;}
 if(code==='KeyF'){lvFit();return;}
 if(code==='Digit0'||code==='Numpad0'){lvZoom(1);return;}
 if(e.key==='+'||code==='NumpadAdd'||code==='Equal'){lvZoom(vs().z*1.25);return;}
 if(e.key==='-'||code==='NumpadSubtract'||code==='Minus'){lvZoom(vs().z/1.25);return;}
});
window.addEventListener('keyup',function(e){if(e.code==='Space'&&spaceDown){spaceDown=false;lvCursor();lvNeed=true;}});
window.addEventListener('blur',function(){spaceDown=false;});

/* ---------- hooks & loop ---------- */
renderAllHooks.push(function(){lvNeed=true;});
changeHooks.push(function(w){lvNeed=true;updStatus();if(w.sheets||w.objects||w.globals){renderTree();}if((w.layout||w.layers)&&ui.active&&ui.active.kind==='layout')renderLayers();});
function loop(){requestAnimationFrame(loop);if(!$('#play').hidden)return;var a=ui.active;if(a&&a.kind==='layout'){if(lvResize())lvNeed=true;if(lvNeed){lvNeed=false;lvRender();}}}

/* ---------- init ---------- */
(function init(){
 renderLvTools();updUndo();setSave('ok');requestAnimationFrame(loop);
 var go=function(p,isNew){loadProject(p);undoS=[];updUndo();setSave('ok');
  if(isNew)setTimeout(function(){showLvHint('Glissez des <b>objets</b> depuis le panneau Projet, ouvrez <b>Événements</b> pour la logique, puis <b>F5</b> pour tester.');},500);else toast('Projet « '+p.name+' » restauré','info');};
 loadSaved().then(function(restored){if(restored)go(restored,false);else sampleProject().then(function(p){go(p,true);if(!navigator.webdriver)setTimeout(function(){openTemplates(true);},300);});});
 window.__pf={get project(){return project;},get SE(){return SE;},get playing(){return playing;},openTab:openTab,openSpriteEditor:openSpriteEditor,selectInsts:selectInsts,validateProject:validateProject,tmInst:function(){return tmInst();},ui:ui,ev:function(s){return eval(s);}};
})();
function afterProjectSwap(){updUndo();if(ui.active&&ui.active.kind==='layout'&&layoutById(ui.active.id))renderLayers();var ks=ui.sel,L0=curLayout();if(ks.kind==='inst'&&L0){var ids=ks.ids.filter(function(id){return L0.instances.some(function(i){return i.id===id;});});ui.sel=ids.length?{kind:'inst',ids:ids}:{kind:null,ids:[]};}else if(ks.kind==='obj'&&objById(ks.ids[0])){}else ui.sel={kind:null,ids:[]};if(!tmInst())ui.tmTool=null;renderTree();renderTabs();var a=ui.active;if(!a||!(a.kind==='layout'?layoutById(a.id):sheetById(a.id)))activate(ui.tabs[0]||null);else{renderProps();if(a.kind==='sheet')renderSheet();}lvNeed=true;$('#projName').value=project.name;scheduleSave();updStatus();}

})();
</script>
